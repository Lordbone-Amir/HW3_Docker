services:
  app:
    build: .
    environment:
      GREETING: ${GREETING:-Hello, Docker!}
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
